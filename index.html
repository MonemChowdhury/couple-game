<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Night for Two</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@700&display=swap">
<style>
/* Layout: a level path ("board") under a slim chip bar; one big action per screen. Every mood theme rewrites these tokens. */
:root{
  --bg1:#0b1026; --bg2:#2a3a6e; --onbg:#e8ecff; --paper:#151c3a; --ink:#eef1ff; --muted:#a3acd6; --line:#2c3766; --tile:#1f2850;
  --a1:#ffd166; --a2:#9b8cff; --a3:#5ec8ff; --btn:#1b1400;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg1);background-image:linear-gradient(165deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg1)}
#bgfx,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bgfx{z-index:0} #fx{z-index:40}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding-block:10px 36px;display:flex;flex-direction:column;gap:14px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding-block:6px}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:999px;
  padding:7px 12px;font:700 14px var(--body);cursor:pointer;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.18);min-height:38px}
.chip.icon{width:40px;justify-content:center;padding:0}
.card{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 14px 34px rgba(0,0,0,.22);animation:pop .35s ease}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.4}to{transform:none;opacity:1}}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--a1)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.12;text-wrap:balance}
h1{font-size:clamp(30px,8.5vw,40px)} h2{font-size:25px} h3{font-size:19px}
p{margin:0} .muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center} .between{justify-content:space-between} .center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 18px var(--display);border:none;border-radius:16px;padding:12px 20px;
  cursor:pointer;background:var(--a1);color:var(--btn);text-decoration:none;min-height:52px;box-shadow:0 4px 0 color-mix(in srgb,var(--a1) 55%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--a1) 55%,#000)}
.btn.big{width:100%;font-size:21px;min-height:62px}
.btn.alt{background:var(--tile);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.wa{background:#25D366;color:#05301a;box-shadow:0 4px 0 #128C7E}
.btn:disabled{opacity:.45}
.link{background:none;border:none;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:6px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a2);outline-offset:2px}

/* lock */
.code{display:flex;justify-content:center;gap:12px}
.code i{width:16px;height:16px;border-radius:50%;border:2px solid var(--a1)}
.code i.f{background:var(--a1)}
.code.bad{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:270px;width:100%;margin:0 auto}
.pad button{font:700 22px var(--mono);border:2px solid var(--line);background:var(--tile);color:var(--ink);border-radius:16px;padding:12px 0;cursor:pointer}

/* who / mood */
.who{display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 8px;border-radius:20px;border:3px solid transparent;cursor:pointer;
  background:var(--tile);color:var(--ink);font:600 20px var(--display)}
.who b{font-size:38px;line-height:1.1} .who small{font:600 13px var(--body);color:var(--muted)}
.mode{display:flex;gap:6px;background:var(--tile);border-radius:14px;padding:4px}
.mode button{flex:1;border:none;border-radius:11px;padding:10px 6px;background:transparent;color:var(--muted);font:700 14px var(--body);cursor:pointer}
.mode button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.moods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mood{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border-radius:20px;border:2px solid var(--line);background:var(--tile);
  color:var(--ink);cursor:pointer;font:600 17px var(--display);transition:transform .15s}
.mood:active{transform:scale(.96)}
.mood b{font-size:36px;line-height:1.1} .mood small{font:600 12px var(--body);color:var(--muted);text-align:center}
.mood.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 16%,var(--tile))}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--tile);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.rules{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:flex-start;background:var(--tile);border-radius:14px;padding:10px 12px;font-size:15px}
.rules li b{font-size:20px;line-height:1.2}
.score.solo{grid-template-columns:1fr}

/* board */
.clocks{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.clk{background:var(--tile);border-radius:14px;padding:8px 6px;min-width:0}
.clk b{display:block;font:700 19px var(--mono);font-variant-numeric:tabular-nums}
.clk span{font-size:12px;color:var(--muted)}
.path{display:flex;align-items:center;overflow-x:auto;padding:10px 4px 26px;scrollbar-width:none}
.path::-webkit-scrollbar{display:none}
.node{flex:0 0 auto;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:23px;background:var(--tile);border:3px solid var(--line);position:relative}
.node small{position:absolute;top:100%;margin-top:4px;font:700 11px var(--mono);color:var(--muted);white-space:nowrap}
.node.done{background:var(--a3);border-color:var(--a3)}
.node.cur{border-color:var(--a1);transform:scale(1.14);box-shadow:0 0 0 6px color-mix(in srgb,var(--a1) 28%,transparent);animation:pulse 1.8s ease-in-out infinite}
.node.lock{opacity:.55}
@keyframes pulse{50%{box-shadow:0 0 0 11px color-mix(in srgb,var(--a1) 10%,transparent)}}
.seg{flex:1 0 18px;height:5px;border-radius:3px;background:var(--line)} .seg.done{background:var(--a3)}
.turn{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--tile)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--a1);color:var(--btn);flex:0 0 auto}
.turn .t{min-width:0}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px}
.score b{display:block;font:700 30px var(--mono);font-variant-numeric:tabular-nums}
.score span{font-size:14px;color:var(--muted)}
.vs{font:700 14px var(--mono);color:var(--a1)}
.key{font:700 clamp(30px,10vw,40px) var(--mono);letter-spacing:.14em;text-align:center;padding:14px 8px;border-radius:18px;background:var(--tile);
  border:2px dashed var(--a1);user-select:all;font-variant-numeric:tabular-nums}
.keyin{font:700 24px var(--mono);letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);
  background:var(--paper);color:var(--ink);width:100%}
.err{color:var(--a1);font-weight:800;min-height:1.4em;font-size:15px}
.steps{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:20px;font-size:15px}

/* games */
.status{font:700 14px var(--mono);color:var(--muted);min-height:1.5em}
.earned{font-family:var(--display);color:var(--a3);font-size:17px}
.pz{display:grid;gap:3px;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;background:var(--tile);padding:3px;border-radius:14px}
.tile{border:none;border-radius:7px;cursor:pointer;position:relative;padding:0;background-color:var(--line)}
.tile.blank{background:transparent;cursor:default}
.tile span{position:absolute;top:3px;left:5px;font:700 11px var(--mono);color:#fff;text-shadow:0 1px 2px #000a}
.pz.hide .tile span{display:none}
.pz.solved{gap:0;padding:0} .pz.solved .tile{border-radius:0}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:3/4;perspective:600px;border:none;background:none;padding:0;cursor:pointer}
.mc .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.up .in,.mc.got .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;backface-visibility:hidden}
.mc .b{background:var(--a2);color:var(--btn);font:700 22px var(--display)}
.mc .f{background:var(--tile);transform:rotateY(180deg);font-size:30px}
.mc.got .f{outline:3px solid var(--a1)}
.q{font:600 22px var(--display);min-height:3.4em;text-wrap:balance}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick .btn{width:100%}
.pick .btn.b2{background:var(--a2);box-shadow:0 4px 0 color-mix(in srgb,var(--a2) 55%,#000)}
.field{position:relative;height:360px;background:var(--tile);border-radius:18px;overflow:hidden;touch-action:manipulation;user-select:none}
.ht{position:absolute;font-size:36px;line-height:1;border:none;background:none;padding:4px;cursor:pointer}
.ht.pop{animation:popout .25s forwards}
@keyframes popout{to{transform:scale(1.8);opacity:0}}
.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;background:color-mix(in srgb,var(--tile) 70%,transparent)}
.hud{display:flex;justify-content:space-between;font:700 15px var(--mono)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden} .bar i{display:block;height:100%;background:var(--a1);width:0;transition:width .2s}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:300px;width:100%;margin:0 auto}
.ttt button{aspect-ratio:1;border:none;border-radius:14px;background:var(--tile);font-size:40px;cursor:pointer;color:var(--ink)}
.ttt button.w{background:color-mix(in srgb,var(--a1) 45%,var(--tile))}

/* reveal */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.cmp div{background:var(--tile);border-radius:16px;padding:12px 8px;border:3px solid transparent}
.cmp div.win{border-color:var(--a1)}
.cmp b{display:block;font:700 clamp(20px,6vw,24px) var(--mono);white-space:nowrap}
.cmp span{font-size:14px;color:var(--muted)}
.verdict{font:600 22px var(--display);text-align:center;text-wrap:balance}
.scr{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden}
.scr .under{position:absolute;inset:0;background:var(--tile);display:grid;place-items:center;text-align:center;padding:18px;font:600 19px var(--display);text-wrap:balance}
.scr canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .5s}
.wheelbox{position:relative;width:100%;max-width:300px;aspect-ratio:1;margin:0 auto}
.wheelbox canvas{width:100%;height:100%}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--ink)}
.result{font:600 22px var(--display);text-align:center;min-height:1.3em}
.album{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.album figure{margin:0;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--tile)}
.album figure:first-child{grid-column:span 2;aspect-ratio:4/3}
.album img{width:100%;height:100%;object-fit:cover;display:block}
.addph{display:grid;gap:8px;padding:14px;border-radius:14px;background:var(--tile);text-align:center}
.addph input{display:none}
.addph label.btn{cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:30;background:var(--paper);color:var(--ink);
  border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-weight:800;display:flex;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .45s cubic-bezier(.3,1.4,.5,1);white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.credit{color:var(--onbg);opacity:.85;text-align:center;font-size:13px}
/* v2: twists, commentary, rewards, finale, new games, options */
.twist{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--a2) 22%,var(--tile));border:2px solid var(--a2);animation:twistin .6s cubic-bezier(.3,1.5,.5,1)}
.twist b{font-size:30px;line-height:1}
.twist h3{font-size:18px} .twist p{font-size:14px;color:var(--muted)}
@keyframes twistin{0%{transform:scale(.6) rotate(-4deg);opacity:0}100%{transform:none;opacity:1}}
.goal{display:flex;justify-content:space-between;font:700 13px var(--mono);color:var(--muted)}
.node.fin{background:color-mix(in srgb,var(--a1) 25%,var(--tile));border-color:var(--a1)}
.talk{display:flex;flex-direction:column;gap:6px}
.talk p{background:var(--tile);border-radius:14px;padding:10px 12px;font-weight:700;font-size:15px;text-align:center}
.rw{display:flex;flex-direction:column;gap:10px}
.rw .who2{font:700 13px var(--mono);color:var(--a1);text-transform:uppercase;letter-spacing:.06em}
.scr .under small{display:block;font:600 13px var(--body);color:var(--muted);margin-top:6px}
.box{display:grid;place-items:center;gap:6px;width:100%;aspect-ratio:16/9;border-radius:18px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--btn);font:600 20px var(--display)}
.box b{font-size:56px;line-height:1;display:block;animation:wob 1.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
.box.open b{animation:boom .5s forwards}
@keyframes boom{to{transform:scale(2.2);opacity:0}}
.prize{background:var(--tile);border-radius:18px;padding:18px;text-align:center;font:600 19px var(--display);border:2px dashed var(--a1);animation:pop .4s}
.opts{gap:10px}
.opts .grid2 .btn{font-size:17px;border:2px solid var(--line)}
.trophy{font-size:92px;line-height:1;text-align:center;animation:twistin .9s cubic-bezier(.3,1.5,.5,1)}
.champ{text-align:center;font:700 clamp(30px,9vw,42px) var(--display);color:var(--a1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--tile);border-radius:14px;padding:10px 4px}
.stats b{display:block;font:700 24px var(--mono)} .stats span{font-size:12px;color:var(--muted)}
.badge{display:flex;gap:10px;align-items:center;background:var(--tile);border-radius:14px;padding:10px 12px;font-weight:700}
.badge b{font-size:26px}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:320px;width:100%;margin:0 auto}
.simon button{aspect-ratio:1;border:none;border-radius:22px;font-size:46px;cursor:pointer;background:var(--tile);transition:transform .1s,filter .1s;color:var(--ink)}
.simon button:nth-child(1){background:color-mix(in srgb,var(--a1) 40%,var(--tile))}
.simon button:nth-child(2){background:color-mix(in srgb,var(--a2) 40%,var(--tile))}
.simon button:nth-child(3){background:color-mix(in srgb,var(--a3) 40%,var(--tile))}
.simon button.lit{transform:scale(1.07);filter:brightness(1.35) saturate(1.4);box-shadow:0 0 0 5px var(--a1)}
.simon.wait button{pointer-events:none}
.odd{display:grid;gap:6px;width:100%;max-width:340px;margin:0 auto}
.odd button{aspect-ratio:1;border:none;border-radius:10px;background:var(--paper);cursor:pointer;padding:0;line-height:1;font-size:inherit;display:grid;place-items:center}
.odd button.bad{animation:shake .3s}
.tbar{position:relative;height:64px;border-radius:18px;background:var(--tile);overflow:hidden}
.tzone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--a3) 45%,transparent);border-left:2px solid var(--a3);border-right:2px solid var(--a3)}
.tmid{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--a1)}
.tdot{position:absolute;top:50%;font-size:36px;line-height:1;transform:translate(-50%,-50%)}
.tries{display:flex;gap:6px;justify-content:center;font-size:22px;min-height:30px}
.toast button{margin-left:10px;border:none;background:var(--a1);color:var(--btn);border-radius:999px;padding:4px 12px;font:800 14px var(--body);cursor:pointer}
.credit b{user-select:all}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<canvas id="bgfx" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top" id="top" hidden>
    <button class="chip" id="themeChip" aria-label="Change mood"></button>
    <span class="grow"></span>
    <span class="chip" id="lvChip"></span>
    <button class="chip icon" id="snd" aria-label="Music on">♪</button>
  </header>
  <main id="view"></main>
  <p class="credit">Made with love by Monem · want one for your someone? <b>info@monemshariar.com</b></p>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// ================= Edit these for each couple =================
const CONFIG = {
  her: "Mira", him: "Sam",                         // Partner 1 / Partner 2 first names
  herPlace: "Toronto", herTz: "America/Toronto",   // city shown on screen + IANA time zone
  himPlace: "London", himTz: "Europe/London",
  lock: "1402",                                    // 4 digits, DDMM of a date that matters to them
  lockHint: "To unlock, enter the day you first met: day then month (DDMM).",
  from: "",                                        // sign-off, e.g. "Your best friend Sara"
  photo: "media/puzzle.jpg",                       // square couple photo for the puzzle
  album: ["media/w1.jpg","media/w2.jpg","media/w3.jpg","media/w4.jpg","media/w5.jpg"],
  music: "media/music.mp3"                         // set to "" for no music
};
// ===============================================================

  const c=ALPH[n&31]+ALPH[(n>>5)&31]+ALPH[(n>>10)&31]; return c+ALPH[cyrb53(c+SECRET)%32]; }
function decodeD(code){ code=String(code||'').toUpperCase().trim(); if(code.length!==4) return null; const c=code.slice(0,3);
  if(ALPH[cyrb53(c+SECRET)%32]!==code[3]) return null; const v=[...c].map(ch=>ALPH.indexOf(ch)); if(v.some(x=>x<0)) return null;
  const n=v[0]|(v[1]<<5)|(v[2]<<10), d={sit:n&1?'home':'ld', style:STYLE_IDS[(n>>1)&3], len:(n>>3)&3, diff:(n>>5)&3, mask:(n>>7)&255};
  if(d.len>2||d.diff>2||popcount(d.mask)<2) return null; d.code=code; return d; }

function cyrb53(str, seed=0){ let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed;
  for(let i=0,ch;i<str.length;i++){ ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507); h1^=Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507); h2^=Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0); }

function shrink(file, max, square){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ let sx=0,sy=0,sw=im.naturalWidth,sh=im.naturalHeight;
    if(square){ const m=Math.min(sw,sh); sx=(sw-m)/2; sy=(sh-m)/2; sw=sh=m; }
    const k=Math.min(1,max/Math.max(sw,sh)), c=document.createElement('canvas'); c.width=Math.round(sw*k); c.height=Math.round(sh*k);
    c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',.8)); };
  im.onerror=()=>{ URL.revokeObjectURL(u); rej(); }; im.src=u; }); }
async function addMyPhotos(files){ files=[...files].filter(f=>/^image\//.test(f.type)).slice(0,6); if(!files.length) return false;
  const album=[]; for(const f of files){ try{ album.push(await shrink(f,900,false)); }catch(e){} }
  if(!album.length){ toast("Couldn't read those photos. Try JPG or PNG."); return false; }
  let puzzle=null; try{ puzzle=await shrink(files[0],600,true); }catch(e){}
  try{ localStorage.setItem(NS+'myPhotos',JSON.stringify({album,puzzle})); }
  catch(e){ toast('Too many big photos. Try fewer.'); return false; }
  applyMyPhotos(); return true; }

const other = r => r==='her'?'him':'her';
const starterOf = L => L%2 ? 'her' : 'him';
const NLV = () => [5,10,15][D.len];
const runOf = () => store.get('run_'+D.code,0);
function rng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
let SEQ={key:null,list:[]};
function seqFor(){ const key=D.code+'|'+runOf(); if(SEQ.key===key) return SEQ.list;
  const g=GLIST(), N=NLV(), out=[]; let lap=0;
  while(out.length<N){ const r=rng(cyrb53(key+'|lap'+lap)), a=g.slice();
    for(let k=a.length-1;k>0;k--){ const j=Math.floor(r()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; }
    if(out.length&&a.length>1&&a[0]===out[out.length-1]) [a[0],a[a.length-1]]=[a[a.length-1],a[0]];
    out.push(...a); lap++; }
  SEQ={key,list:out.slice(0,N)}; return SEQ.list; }
const gameOf = L => seqFor()[(Math.min(L,NLV())-1)];
function twistOf(L){ const N=NLV(); if(L>=N) return 'final'; if(L===1) return null;
  const x=rng(cyrb53(D.code+'|'+runOf()+'|tw'+L))(); return x<.2?'double':x<.36?'boss':x<.54?'mystery':null; }
const TWISTS = { double:{e:"⚡",name:"Double points",desc:"The winner of this level gets 2 points."},
  boss:{e:"😈",name:"Boss level",desc:"This one is extra hard. Good luck!"},
  mystery:{e:"🎁",name:"Mystery box",desc:"The winner opens a mystery prize."},
  final:{e:"🏁",name:"Final level",desc:"Worth 3 points. Everything is on the line!"} };
const ptsOf = L => ({final:3,double:2}[twistOf(L)]||1);
const tierOf = L => { const N=NLV(); return D.diff + Math.round(3*(Math.min(L,N)-1)/Math.max(1,N-1)) + (twistOf(L)==='boss'?1:0); };
const clamp = x => Math.max(0,Math.min(255,Math.round(x)));

// level keys: 6 characters that prove a partner finished a level and carry their result
const ALPH = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
function makeKey(L, role, p){ let n=cyrb53(SECRET+'|'+D.code+'|'+L+'|'+role+'|'+p), s='';
  for(let i=0;i<6;i++){ s+=ALPH[n%32]; n=Math.floor(n/32); } return s.slice(0,3)+'-'+s.slice(3); }
function readKey(code, L, role){ const c=String(code).toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/O/g,'0').replace(/I/g,'1');
  if(c.length!==6) return null; for(let p=0;p<256;p++) if(makeKey(L,role,p).replace('-','')===c) return p; return null; }

function sfx(f=660,d=.09,type="triangle",v=.07){ if(!soundOn) return; try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(v,AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+d); }catch(e){} }

// ---------- confetti + themed background ----------
const fx=$('#fx'), fcx=fx.getContext('2d'); let parts=[], fraf=0;
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function confetti(){ if(reduce) return; fx.width=innerWidth; fx.height=innerHeight; const cols=['--a1','--a2','--a3'].map(cssv);
  for(let i=0;i<110;i++) parts.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*13,vy:Math.random()*-12-3,r:Math.random()*7+3,c:cols[i%3],a:Math.random()*6,life:95});
  if(!fraf) floop(); }
function floop(){ fcx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;p.life--;fcx.save();fcx.translate(p.x,p.y);fcx.rotate(p.a);fcx.fillStyle=p.c;fcx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);fcx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<fx.height+20); fraf=parts.length?requestAnimationFrame(floop):0; if(!fraf) fcx.clearRect(0,0,fx.width,fx.height); }
const win=()=>{ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>sfx(f,.15),i*110)); confetti(); };
const bg=$('#bgfx'), bcx=bg.getContext('2d'); let flo=[], braf=0;
function startBg(t){ cancelAnimationFrame(braf); const dpr=Math.min(2,devicePixelRatio||1); bg.width=innerWidth*dpr; bg.height=innerHeight*dpr;
  flo=Array.from({length:16},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:16+Math.random()*22,v:.2+Math.random()*.5,w:Math.random()*6,e:t.fx[Math.floor(Math.random()*t.fx.length)]}));
  const draw=()=>{ bcx.setTransform(dpr,0,0,dpr,0,0); bcx.clearRect(0,0,innerWidth,innerHeight); bcx.globalAlpha=.28;
    flo.forEach(f=>{ if(!reduce){ f.y-=f.v; f.w+=.01; if(f.y<-40){ f.y=innerHeight+30; f.x=Math.random()*innerWidth; } }
      bcx.font=f.s+'px serif'; bcx.fillText(f.e,f.x+Math.sin(f.w)*14,f.y); });
    if(!reduce && !document.hidden) braf=requestAnimationFrame(draw); };
  draw(); }

function shareText(L,key){ return `💌 ${nm(ME)} finished Level ${L} of our game! Your key: ${key}\n${gameLink()}`; }

function vGame(player){ chrome(true); const L=S.lvl, gid=gameOf(L), g=GAMES[gid], t=tierOf(L);
  const tw=TWISTS[twistOf(L)];

  ({puzzle:gPuzzle, match:gMatch, likely:gLikely, catch:gCatch, ttt:gTTT, simon:gSimon, odd:gOdd, timing:gTiming})[gid]($('#area'), t, done);

function onPlayed(player, payload){
  if(MODE==='one'){
    if(S.phase==='a'){ S.a=payload; S.phase='b'; save(); return vPass(); }
    S.mine=S.a; S.theirs=payload; save(); return vReveal(starterOf(S.lvl));
  }
  S.mine=payload; S.lastKey={L:S.lvl,k:makeKey(S.lvl,ME,payload)}; save();
  if(S.theirs!=null) return vSent(); S.phase='await'; save(); vHome(); }

function vPass(){ const nxt=other(starterOf(S.lvl));
  show(`<section class="card" style="text-align:center"><span class="eyebrow">Level ${S.lvl}</span><h1>📱➡️</h1>

function vSent(){ const O=other(ME), L=S.lvl;
  show(`<section class="card"><span class="eyebrow">Level ${L} · done</span><h2>Send your key to ${esc(nm(O))}</h2>
    <p class="muted">${esc(nm(O))} needs it to see who won this level.</p>${shareHTML(L,S.lastKey.k)}
    <button class="btn big" id="see">See who won</button></section>`); bindCopy(); $('#see').onclick=()=>vReveal(); }

function verdict(gid, pa, pb, ra, rb){ const g=GAMES[gid], nq=D.len===0?5:8;
  if(pb==null) return {text:`${nm(rb)} has already moved ahead. On to the next level!`, w:null};
  if(gid==='likely'){ let same=0; for(let i=0;i<nq;i++) if(((pa>>i)&1)===((pb>>i)&1)) same++;
    const ok=same>=Math.ceil(nq/2)&&D.style!=='team';
    return {text: (same>=nq*.75?`You agreed on ${same} of ${nq}. You really know each other! 💞`: same>=nq/2?`You agreed on ${same} of ${nq}. Talk about the rest ${D.sit==='ld'?'on your next call':'over dinner'} 😄`:`Only ${same} of ${nq} the same! Time for a long chat 😂`)+(ok?' +1 point each!':''), same, w:ok?'both':null}; }
  if(D.style==='team'){ const sum=pa+pb;
    return {text: gid==='ttt' ? `You both got past the bot (${pa+pb} of 4 team points). Level cleared together! 🤝` :
      `Team total: ${sum} ${g.unit}. Level cleared together! 🤝`, w:null}; }
  const better = g.better==='low' ? (a,b)=>a<b : (a,b)=>a>b;
  if(pa===pb) return {text:"It's a tie! Perfect match 💞", w:'tie'};
  const w = better(pa,pb)?ra:rb, L=S.lvl;
  const pts=ptsOf(L); return {text:`${nm(w)} wins Level ${L}${pts>1?` and ${pts} points`:''}! 🏆`, w}; }
function fmt(gid,p){ if(p==null) return '—'; if(gid==='ttt') return ['Lost','Draw','Win'][p]||p; if(gid==='likely') return (D.len===0?5:8)+' answers'; const u=GAMES[gid].unit; return p+' '+(p===1&&/s$/.test(u)?u.slice(0,-1):u); }

function talkLines(before, v, L){ const N=NLV(), out=[];
  if(D.style==='team'){ out.push(`🤝 ${L} of ${N} levels cleared together!`); }
  else { const a=S.wins.her, b=S.wins.him, lead=a>b?'her':b>a?'him':null, a0=before.her, b0=before.him, lead0=a0>b0?'her':b0>a0?'him':null;
    if(lead&&lead0&&lead!==lead0) out.push(`🔄 ${nm(lead)} takes the lead!`);
    else if(lead&&!lead0&&L>1) out.push(`🚀 ${nm(lead)} pulls ahead!`);
    let k=0, h=S.hist||[], last=h[h.length-1]; if(last) for(let i=h.length-1;i>=0&&h[i]===last;i--) k++;
    if(k>=3) out.push(`🔥 ${nm(last)} is on a ${k}-level winning streak!`);
    if(!lead&&L>1) out.push(`⚖️ All square at ${a}–${b}!`);
    if(lead&&Math.abs(a-b)>=3&&L<N) out.push(`😬 ${nm(other(lead))}, time for a comeback!`); }
  const left=N-L;
  if(left===1) out.push('🏁 Next up: the FINAL level, worth 3 points!');
  else if(left>1&&left<=3) out.push(`⏳ Only ${left} levels left!`);
  if(L===Math.ceil(N/2)&&left>0) out.push('🎡 Halfway there! Spin the bonus wheel below.');
  return out.slice(0,3); }
function pickFresh(key, arr){ const k='seen_'+key+'_'+(MODE==='one'?'one':ME); let seen=store.get(k,[]);
  let av=arr.map((_,i)=>i).filter(i=>!seen.includes(i)); if(!av.length){ seen=[]; av=arr.map((_,i)=>i); }
  const i=av[Math.floor(Math.random()*av.length)]; store.set(k,seen.concat(i)); return arr[i]; }
function makeRewards(v, L){ const M=REWARDS[MOOD]?MOOD:'rom', R=REWARDS[M], tw=twistOf(L), cards=[];
  const fill=(t,w,l)=>t.replace(/\{w\}/g,nm(w)).replace(/\{l\}/g,nm(l));
  if(v.w==='her'||v.w==='him'){ const w=v.w, l=other(w);
    let tasks=R.task; if(D.style==='silly') tasks=tasks.concat(SILLY_DARES.map(d=>'Silly dare: '+d.charAt(0).toUpperCase()+d.slice(1)+'.'));
    if(D.style==='rom') tasks=tasks.concat(ROM_PRIZES.map(d=>d.charAt(0).toUpperCase()+d.slice(1).replace(/the winner/g,'{w}')+'.'));
    const mys = tw==='mystery'||tw==='final';
    cards.push({who:w, kind:mys?'mystery':'perk', text:fill(mys?pickFresh('mys',MYSTERY):pickFresh(M+'p',R.perk),w,l)});
    cards.push({who:l, kind:'task', text:fill(pickFresh(M+'t'+D.style,tasks),w,l)}); }
  else { const all=Object.values(REWARDS).flatMap(r=>r.both), pool=D.sit==='ld'?all:all.filter(t=>!/teleport|play it at the same time/.test(t));
    cards.push({who:'both', kind:'both', text:pool[Math.floor(rng(cyrb53(D.code+'|'+runOf()+'|both'+L))()*pool.length)]}); }
  return MODE==='two' ? cards.filter(c=>c.who===ME||c.who==='both') : cards; }
function rewardHTML(c, i){ const mine=MODE==='two'&&c.who===ME;
  const head = c.kind==='both' ? '💞 For both of you' : c.kind==='task' ? `💌 ${mine?'Your':esc(nm(c.who))+"'s"} task` : c.kind==='mystery' ? `🎁 ${mine?'Your':esc(nm(c.who))+"'s"} mystery box` : `🏆 ${mine?'Your':esc(nm(c.who))+"'s"} prize`;
  if(c.kind==='mystery') return `<div class="rw"><span class="who2">${head}</span><button class="box" data-box="${i}"><b>🎁</b>Tap to open</button><div class="prize" id="bx${i}" hidden>${esc(c.text)}</div></div>`;
  return `<div class="rw"><span class="who2">${head}</span><div class="scr"><div class="under">${esc(c.text)}</div><canvas class="scrc"></canvas></div></div>`; }
function vReveal(firstRole){ chrome(true); const L=S.lvl, gid=gameOf(L), N=NLV();
  const ra = MODE==='one'?firstRole:ME, rb=other(ra), pa=S.mine, pb=S.skip!=null&&S.theirs==null?null:S.theirs;
  const v=verdict(gid,pa,pb,ra,rb);
  if(S.counted<L){ const before={...S.wins}; S.counted=L;
    if(v.w==='both'){ S.wins.her++; S.wins.him++; } else if(v.w&&v.w!=='tie') S.wins[v.w]+=ptsOf(L);
    S.hist=(S.hist||[]).concat(v.w==='her'||v.w==='him'?v.w:null); if(v.same) S.agree+=v.same;
    S.talk=talkLines(before,v,L); S.rw={L, cards:makeRewards(v,L)}; save(); }
  if(!S.rw||S.rw.L!==L){ S.rw={L, cards:makeRewards(v,L)}; save(); }
  const last=L>=N, wheel=L===Math.ceil(N/2)&&!last;
  show(`<section class="card"><span class="eyebrow">Level ${L} of ${N} complete</span><h1>${last?'🏁 Final level done!':'🎉 Level '+L+' done!'}</h1>
    ${gid!=='likely'&&pb!=null?`<div class="cmp"><div class="${v.w===ra?'win':''}"><b>${fmt(gid,pa)}</b><span>${esc(nm(ra))}</span></div>
      <div class="${v.w===rb?'win':''}"><b>${fmt(gid,pb)}</b><span>${esc(nm(rb))}</span></div></div>`:''}
    <p class="verdict">${esc(v.text)}</p>${scoreHTML()}
    ${(S.talk||[]).length?`<div class="talk">${S.talk.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`:''}</section>
    <section class="card"><span class="eyebrow">${last?'Final reward':L/N<.34?'Warm-up reward':L/N<.67?'Heating up':'Final stretch'}</span>
      <h3>${S.rw.cards.some(c=>c.kind==='mystery')?'A mystery box appeared!':'Scratch to reveal'}</h3>
      ${S.rw.cards.map(rewardHTML).join('')}</section>
    ${wheel?`<section class="card"><span class="eyebrow">Halfway bonus</span><h3>${D.sit==='ld'?"Spin for tonight's call":'Spin for a date idea'}</h3>
      <div class="wheelbox"><canvas id="wheel" width="600" height="600"></canvas><div class="pointer"></div></div>
      <div class="result" id="wRes"></div><p class="muted" id="wDesc" style="text-align:center"></p><div class="row center"><button class="btn" id="spin">Spin</button></div></section>`:''}
    <button class="btn big" id="next">${last?'See the grand finale 🏆':'Next level →'}</button>`);
  win(); mountScratch(); if(wheel) mountWheel();
  $$('[data-box]').forEach(b=>b.onclick=()=>{ if(b.classList.contains('open')) return; b.classList.add('open'); sfx(400,.1);
    setTimeout(()=>{ b.hidden=true; $('#bx'+b.dataset.box).hidden=false; win(); },500); });
  $('#next').onclick=()=>{ const skip=S.skip; S.skip=null; enterLevel(L+1, last?null:skip);
    if(last) return vFinale(); const t=TWISTS[twistOf(L+1)]; if(t){ toast(t.e+' '+t.name+'!'); [660,880,1100].forEach((f,i)=>setTimeout(()=>sfx(f,.12,'square',.05),i*120)); } vHome(); }; }

function vFinale(){ chrome(true); const N=NLV(), a=S.wins.her, b=S.wins.him, M=REWARDS[MOOD]?MOOD:'rom', team=D.style==='team';
  const champ = team?null : a>b?'her':b>a?'him':null, lose=champ?other(champ):null;
  let best=0, cur=0, prev=null; (S.hist||[]).forEach(w=>{ if(w&&w===prev) cur++; else cur=w?1:0; prev=w; best=Math.max(best,cur); });
  const r=rng(cyrb53(D.code+'|'+runOf()+'|grand'))();
  const prize = champ ? GRAND[Math.floor(r*GRAND.length)].replace(/\{w\}/g,nm(champ)).replace(/\{l\}/g,nm(lose)) : GRAND_BOTH[Math.floor(r*GRAND_BOTH.length)];
  show(`<section class="card" style="text-align:center"><span class="eyebrow">The grand finale</span>
    <div class="trophy">${champ?'👑':team?'🏆':'💞'}</div>
    <div class="champ">${champ?esc(nm(champ))+' wins!':team?'Team champions!':"It's a tie!"}</div>
    <p class="verdict">${champ?`Champion of ${esc(gameTitle())}`:team?`${esc(nm('her'))} & ${esc(nm('him'))} cleared all ${N} levels together`:'A perfect match, right to the very end'}</p>
    <div class="stats">${team?`<div><b>${N}</b><span>levels</span></div><div><b>${S.agree}</b><span>same answers</span></div><div><b>💯</b><span>teamwork</span></div>`
      :`<div><b>${a}–${b}</b><span>final score</span></div><div><b>${best}</b><span>best streak</span></div><div><b>${S.agree}</b><span>same answers</span></div>`}</div>
    ${champ?`<div class="badge"><b>👑</b><span>${esc(nm(champ))}: Champion of Love</span></div><div class="badge"><b>💖</b><span>${esc(nm(lose))}: Most Adorable Challenger</span></div>`
      :`<div class="badge"><b>💞</b><span>${esc(nm('her'))} & ${esc(nm('him'))}: Perfect Match</span></div>`}

function gPuzzle(el, tier, done){ const n=tier>=2?4:3, N=n*n, blank=N-1, img=CONFIG.photo||placeholderImg();

  const pz=el.querySelector('.pz'), stat=el.querySelector('.status'); let st=[...Array(N).keys()], moves=0, solved=false;
  const adj=(a,b)=>Math.abs(a-b)===n||(Math.abs(a-b)===1&&Math.floor(a/n)===Math.floor(b/n));
  let e=blank, prev=-1; for(let i=0;i<(n===3?90+tier*30:220);i++){ const nb=[e-n,e+n,e-1,e+1].filter(p=>p>=0&&p<N&&adj(p,e)&&p!==prev);
    const p=nb[Math.floor(Math.random()*nb.length)]; [st[p],st[e]]=[st[e],st[p]]; prev=e; e=p; }
  if(st.every((v,k)=>v===k)){ const a=st.indexOf(blank), b=a===0?1:a-1; [st[a],st[b]]=[st[b],st[a]]; }
  const pos=v=>`${(v%n)*100/(n-1)}% ${Math.floor(v/n)*100/(n-1)}%`;
  function draw(){ pz.innerHTML=''; st.forEach((v,i)=>{ const b=document.createElement('button'); b.className='tile'+(v===blank&&!solved?' blank':'');

      if(!solved) b.innerHTML=`<span>${v+1}</span>`; b.setAttribute('aria-label','Tile '+(v+1)); } else b.setAttribute('aria-label','Empty space');

    if(st.every((v,k)=>v===k)){ solved=true; pz.classList.add('solved'); draw(); win(); stat.innerHTML=`<span class="earned">Solved in ${moves} moves!</span>`; setTimeout(()=>done(moves),1500); return; }

function roundQs(r){ const LIKELY=quizList(), R=LIKELY.length/8, cyc=Math.floor(r/R), i=r%R, order=LIKELY.map((_,k)=>k);
  if(cyc>0){ let a=(cyc*2654435761)>>>0; const rnd=()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };
    for(let k=order.length-1;k>0;k--){ const j=Math.floor(rnd()*(k+1)); [order[k],order[j]]=[order[j],order[k]]; } }
  return order.slice(i*8,i*8+8).map(k=>LIKELY[k]); }

function gTTT(el, tier, done){ const smart=Math.min(1,.62+.1*tier), L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; let b, over;

  function cpu(){ const free=b.map((v,i)=>v?null:i).filter(v=>v!==null), tw=p=>free.find(i=>{ b[i]=p; const w=wins(b,p); b[i]=null; return w; });
    let m=tw('cpu'); if(m===undefined&&Math.random()<smart) m=tw('me'); if(m===undefined&&!b[4]) m=4; if(m===undefined) m=free[Math.floor(Math.random()*free.length)]; return m; }

  onLeave(box,()=>T.forEach(clearTimeout)); }

      const sg=Math.floor(ang/(Math.PI/4)); if(sg!==lastSeg){ lastSeg=sg; sfx(300,.02,'square',.03); }
      if(t<1) return requestAnimationFrame(tick); spinning=false; const seg=Math.PI*2/DATES.length, a=((-Math.PI/2-ang)%(Math.PI*2)+Math.PI*2)%(Math.PI*2), k=Math.floor(a/seg);
      $('#wRes').textContent=DATES[k]; $('#wDesc').textContent=DATE_DESC[k]; $('#spin').textContent='Spin again'; win(); };
    requestAnimationFrame(tick); };
  draw(); }

window.__gn = { state:()=>S, key:makeKey };

  applyTheme(t||'moon');
  D = decodeD(store.get('design',null)); if(D) MODE=D.sit==='ld'?'two':'one';
  if(!store.get('unlocked',false)) return vLock();
  afterUnlock(); })();
